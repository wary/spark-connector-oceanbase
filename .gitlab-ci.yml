stages:
  - deploy

variables:
  MAVEN_IMAGE: "maven:3.8.8-eclipse-temurin-8"
  MAVEN_SETTINGS_PATH: "settings.xml"
  MUSIC_VERSION: "1.5-MUSIC-SNAPSHOT"
  MAVEN_CLI_OPTS: "-B -U -ntp"
  MAVEN_DEPLOY_OPTS: "-DskipTests -Dgpg.skip=true -Drat.skip=true"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "${CI_PROJECT_NAME}-maven"
  paths:
    - .m2/repository

deploy:music-maven:
  stage: deploy
  image: "${MAVEN_IMAGE}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "music-main"'
  script:
    - test -f "${MAVEN_SETTINGS_PATH}"
    - sed -i '/<!-- Central Publishing Plugin for Maven Central -->/,/<\/plugin>/d' pom.xml
    - perl -0pi -e 's#\n\s*<plugin>\s*<groupId>org\.apache\.maven\.plugins</groupId>\s*<artifactId>maven-source-plugin</artifactId>.*?</plugin>##sg; s#\n\s*<plugin>\s*<groupId>org\.apache\.maven\.plugins</groupId>\s*<artifactId>maven-javadoc-plugin</artifactId>.*?</plugin>##sg; s#\n\s*<execution>\s*<id>test-jar</id>.*?</execution>##sg; s#\n\s*<execution>\s*<id>empty-javadoc-jar</id>.*?</execution>##sg;' pom.xml
    - >
      mvn ${MAVEN_CLI_OPTS}
      --settings "${MAVEN_SETTINGS_PATH}"
      clean deploy
      -pl '!spark-connector-oceanbase-e2e-tests'
      -Drevision="${MUSIC_VERSION}"
      ${MAVEN_DEPLOY_OPTS}
      -DaltDeploymentRepository=snapshots::default::http://mvn.hz.netease.com/artifactory/libs-snapshots
